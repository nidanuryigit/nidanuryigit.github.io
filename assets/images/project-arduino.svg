<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="arduinoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f" />
      <stop offset="100%" stop-color="#00585e" />
    </linearGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#arduinoBg)" rx="16" />

  <!-- Breadboard & Hardware Canvas -->
  <g transform="translate(40, 35)">
    <!-- Arduino Board representation -->
    <rect x="20" y="30" width="220" height="230" rx="10" fill="url(#pcbGrad)" stroke="#22d3ee" stroke-width="1.5" />
    
    <!-- USB Port -->
    <rect x="5" y="55" width="25" height="35" rx="3" fill="#cbd5e1" stroke="#64748b" />
    <!-- Power Jack -->
    <rect x="5" y="195" width="30" height="40" rx="3" fill="#1e293b" />
    
    <!-- Microcontroller Chip (ATmega328P) -->
    <rect x="110" y="110" width="90" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="155" y="134" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ATmega328P</text>
    
    <!-- Pin Headers -->
    <rect x="40" y="35" width="180" height="14" fill="#1e293b" />
    <rect x="40" y="240" width="180" height="14" fill="#1e293b" />
    <text x="130" y="46" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">DIGITAL (PWM ~)</text>
    <text x="130" y="251" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">POWER / ANALOG IN</text>
    
    <text x="130" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">ARDUINO UNO</text>

    <!-- Wires connecting to Sensors -->
    <path d="M190 42 C240 10, 270 10, 310 40" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2" />
    <path d="M200 42 C250 30, 280 40, 310 80" fill="none" stroke="#22c55e" stroke-width="2.5" />
    <path d="M170 245 C230 270, 270 260, 310 200" fill="none" stroke="#eab308" stroke-width="2.5" />
    <path d="M150 245 C220 290, 270 280, 310 240" fill="none" stroke="#3b82f6" stroke-width="2.5" />

    <!-- MQ-2 / MQ-5 Gas Sensor Module -->
    <g transform="translate(310, 25)">
      <rect width="190" height="100" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
      <!-- Round sensor mesh -->
      <circle cx="55" cy="50" r="32" fill="#334155" stroke="#94a3b8" stroke-width="2" />
      <circle cx="55" cy="50" r="26" fill="#475569" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="55" cy="50" r="16" fill="url(#sensorGlow)" />
      
      <text x="100" y="42" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">MQ-2 / MQ-5</text>
      <text x="100" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Gaz &amp; Duman Sensörü</text>
      <text x="100" y="78" fill="#38bdf8" font-family="monospace" font-size="9">PPM Değeri: 142 ppm</text>
    </g>

    <!-- WS2812B Neopixel Ring + LDR -->
    <g transform="translate(310, 150)">
      <rect width="190" height="110" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      
      <!-- Neopixel LEDs Representation -->
      <circle cx="55" cy="55" r="35" fill="none" stroke="#334155" stroke-width="8" />
      <circle cx="55" cy="22" r="5" fill="#f43f5e" />
      <circle cx="78" cy="32" r="5" fill="#ec4899" />
      <circle cx="88" cy="55" r="5" fill="#8b5cf6" />
      <circle cx="78" cy="78" r="5" fill="#3b82f6" />
      <circle cx="55" cy="88" r="5" fill="#06b6d4" />
      <circle cx="32" cy="78" r="5" fill="#10b981" />
      <circle cx="22" cy="55" r="5" fill="#eab308" />
      <circle cx="32" cy="32" r="5" fill="#f97316" />
      
      <!-- LDR icon in center -->
      <circle cx="55" cy="55" r="12" fill="#475569" />
      <text x="55" y="58" fill="#fbbf24" font-size="8" text-anchor="middle">LDR</text>

      <text x="105" y="45" fill="#a78bfa" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">WS2812B &amp; LDR</text>
      <text x="105" y="63" fill="#94a3b8" font-family="sans-serif" font-size="10">Neopixel Akıllı Işık</text>
      <text x="105" y="80" fill="#34d399" font-family="monospace" font-size="9">Lüks: 480 Lux</text>
      <text x="105" y="96" fill="#f472b6" font-family="monospace" font-size="9">Mod: Otomatik RGB</text>
    </g>
  </g>
</svg>
