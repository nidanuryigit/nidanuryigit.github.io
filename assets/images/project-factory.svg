  <text x="300" y="66" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">factory_inventory_system.c — (C / File I/O Architecture)</text>

  <!-- Terminal Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#c9d1d9">
    <text x="85" y="105"><tspan fill="#ff7b72">#include</tspan> <tspan fill="#a5d6ff">&lt;stdio.h&gt;</tspan>  <tspan fill="#8b949e">// Binary file handling &amp; record structs</tspan></text>
    <text x="85" y="125"><tspan fill="#ff7b72">typedef struct</tspan> { <tspan fill="#79c0ff">int</tspan> id; <tspan fill="#79c0ff">char</tspan> name[<tspan fill="#79c0ff">32</tspan>]; <tspan fill="#79c0ff">float</tspan> stock; <tspan fill="#79c0ff">double</tspan> unit_price; } <tspan fill="#ffa657">Product</tspan>;</text>
    
    <text x="85" y="155"><tspan fill="#7ee787">========================================================</tspan></text>
    <text x="85" y="172"><tspan fill="#58a6ff">&gt;&gt;&gt; FABRİKA ENVANTER VE TİCARET YÖNETİM SİSTEMİ v2.1 &lt;&lt;&lt;</tspan></text>
    <text x="85" y="189"><tspan fill="#7ee787">========================================================</tspan></text>
    
    <text x="85" y="212"><tspan fill="#f2cc60">[1]</tspan> Yeni Hammadde &amp; Ürün Kaydı Ekle (fwrite)</text>
    <text x="85" y="230"><tspan fill="#f2cc60">[2]</tspan> Envanter Listele &amp; Kritik Stok Filtresi (fread)</text>
    <text x="85" y="248"><tspan fill="#f2cc60">[3]</tspan> Sevkiyat &amp; Fatura Hesaplama (KDV, Maliyet, Kâr)</text>
    <text x="85" y="266"><tspan fill="#f2cc60">[4]</tspan> Veritabanı Dosyasını Güncelle &amp; Güvenli Çıkış</text>
    
    <text x="85" y="295"><tspan fill="#58a6ff">nida@gibtu-terminal:~$</tspan> <tspan fill="#ffffff">./inventory_manager --load-records</tspan> <tspan fill="#58a6ff" opacity="0.8">▋</tspan></text>
  </g>

