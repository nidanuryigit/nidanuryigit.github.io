<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#cardGrad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="url(#avatarGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.8" />
  <circle cx="200" cy="180" r="105" fill="#1e1e2f" stroke="#6366f1" stroke-width="2" />
  
  <!-- Modern Geometric Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="145" r="48" fill="url(#avatarGrad)" filter="url(#glow)" />
  <circle cx="200" cy="145" r="46" fill="#0f172a" />
  
  <!-- Initials Monogram -->
  <text x="200" y="156" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">NY</text>
  
  <!-- Body / Shoulders -->
  <path d="M130 250 C130 205, 170 195, 200 195 C230 195, 270 205, 270 250 C270 265, 260 275, 200 275 C140 275, 130 265, 130 250 Z" fill="url(#avatarGrad)" opacity="0.9" />

  <!-- Floating Tech Badges -->
  <g transform="translate(60, 80)">
    <rect width="64" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="32" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle">&lt;C /&gt;</text>
  </g>
  <g transform="translate(280, 75)">
    <rect width="76" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="38" y="18" font-family="monospace" font-size="12" font-weight="bold" fill="#22d3ee" text-anchor="middle">Python</text>
  </g>
  <g transform="translate(45, 290)">
    <rect width="90" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="45" y="18" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Arduino</text>
  </g>
  <g transform="translate(270, 290)">
    <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <text x="40" y="18" font-family="monospace" font-size="12" font-weight="bold" fill="#f472b6" text-anchor="middle">SQLite</text>
  </g>
  
  <!-- Bottom Caption -->
  <text x="200" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">Bilgisayar Mühendisliği Öğrencisi</text>
  <text x="200" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">GİBTÜ</text>
</svg>
