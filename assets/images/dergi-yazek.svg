<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="magazineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pageGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#magazineGrad)" rx="16" />

  <!-- Magazine Spread Representation -->
  <g transform="translate(100, 45)">
    <!-- Shadow -->
    <rect x="8" y="10" width="384" height="250" rx="8" fill="#000000" opacity="0.4" />
    
    <!-- Open Book / Spread -->
    <!-- Left Page -->
    <path d="M10 10 L195 0 L195 240 L10 250 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <!-- Right Page -->
    <path d="M205 0 L390 10 L390 250 L205 240 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Spine -->
    <rect x="195" y="0" width="10" height="240" fill="#cbd5e1" />

    <!-- Left Page Content: Cover & Editorial -->
    <rect x="25" y="25" width="155" height="40" rx="4" fill="url(#pageGlow)" />
    <text x="102" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">YAZEK</text>
    <text x="102" y="61" fill="#fdf2f8" font-family="sans-serif" font-size="7" text-anchor="middle" letter-spacing="1">DİJİTAL DERGİ</text>

    <!-- Mockup Article layout on Left Page -->
    <rect x="25" y="80" width="90" height="10" rx="2" fill="#0f172a" />
    <rect x="25" y="98" width="155" height="4" rx="2" fill="#94a3b8" />
    <rect x="25" y="106" width="155" height="4" rx="2" fill="#94a3b8" />
    <rect x="25" y="114" width="130" height="4" rx="2" fill="#94a3b8" />
    
    <rect x="25" y="130" width="155" height="70" rx="4" fill="#e2e8f0" />
    <text x="102" y="170" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">[ Görsel &amp; Mizanpaj ]</text>

    <text x="30" y="225" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold">Editör: Nida Nur Yiğit</text>

    <!-- Right Page Content: Two Columns & Typography -->
    <rect x="220" y="25" width="150" height="12" rx="2" fill="#1e293b" />
    <rect x="220" y="42" width="100" height="6" rx="2" fill="#64748b" />

    <!-- Column 1 -->
    <g transform="translate(220, 60)">
      <rect x="0" y="0" width="70" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="8" width="70" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="16" width="60" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="24" width="70" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="32" width="65" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="40" width="70" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="48" width="50" height="4" rx="1" fill="#94a3b8" />
    </g>

    <!-- Column 2 -->
    <g transform="translate(300, 60)">
      <rect x="0" y="0" width="70" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="8" width="65" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="16" width="70" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="24" width="55" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="32" width="70" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="40" width="68" height="4" rx="1" fill="#94a3b8" />
      <rect x="0" y="48" width="40" height="4" rx="1" fill="#94a3b8" />
    </g>

    <!-- Right Page Quote Box -->
    <rect x="220" y="130" width="150" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="230" y="152" fill="#7c3aed" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">“Teknoloji &amp; Tasarım Buluşması”</text>
    <rect x="230" y="165" width="130" height="4" rx="1" fill="#94a3b8" />
    <rect x="230" y="174" width="90" height="4" rx="1" fill="#94a3b8" />

    <text x="350" y="225" fill="#94a3b8" font-family="sans-serif" font-size="8">Sayı: 04 / Sayfa 12</text>
  </g>
</svg>
